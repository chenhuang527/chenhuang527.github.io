about:
  - I am a faculty member in Computer Science at the School of Artificial Intelligence and Big Data, Sichuan University of Arts and Science. I teach undergraduate computer science courses and conduct research in natural language processing and multimodal sentiment analysis.
  - I received my master's degree in Software Engineering from Xihua University in 2025. My research explores aspect–opinion–sentiment extraction, multimodal learning, and the integration of external knowledge into language understanding.
